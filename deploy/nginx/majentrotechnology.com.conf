server {
    listen 80;
    listen [::]:80;
    server_name majentrotechnology.com www.majentrotechnology.com;

    location /.well-known/acme-challenge/ {
        root /var/www/majentrotechnology.com;
        try_files $uri =404;
    }

    location / {
        return 301 https://majentrotechnology.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.majentrotechnology.com;

    ssl_certificate /etc/letsencrypt/live/majentrotechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/majentrotechnology.com/privkey.pem;

    return 301 https://majentrotechnology.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name majentrotechnology.com;

    root /var/www/majentrotechnology.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/majentrotechnology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/majentrotechnology.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}