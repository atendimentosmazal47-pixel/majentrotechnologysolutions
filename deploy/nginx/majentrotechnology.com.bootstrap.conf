server {
    listen 80;
    listen [::]:80;
    server_name majentrotechnology.com www.majentrotechnology.com;

    root /var/www/majentrotechnology.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /.well-known/acme-challenge/ {
        allow all;
    }
}