name: Deploy site to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Trust Oracle host
        env:
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          test -n "$ORACLE_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"

      - name: Deploy static files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'deploy/' \
            --exclude 'README.md' \
            --exclude 'DEPLOY_ORACLE.md' \
            ./ "$ORACLE_USER@$ORACLE_HOST:/tmp/majentro-site/"
          ssh "$ORACLE_USER@$ORACLE_HOST" \
            'sudo mkdir -p /var/www/majentrotechnology.com && sudo rsync -a --delete /tmp/majentro-site/ /var/www/majentrotechnology.com/ && sudo chown -R www-data:www-data /var/www/majentrotechnology.com && sudo find /var/www/majentrotechnology.com -type d -exec chmod 755 {} + && sudo find /var/www/majentrotechnology.com -type f -exec chmod 644 {} + && sudo nginx -t && sudo systemctl reload nginx'